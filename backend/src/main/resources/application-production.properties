spotify.clientSecret=${SPOTIFY_CLIENT_SECRET}
spotify.authUri=https://accounts.spotify.com/api/token/
spotify.apiUri=https://api.spotify.com

# The combined image's MySQL service listens on the fixed internal 3306 — never the host
# block port. The deploy env still wins when it sets MYSQL_PORT (the compose file pins 3306).
mysql.port=${MYSQL_PORT:3306}
mysql.host=${MYSQL_HOST}
mysql.user=${MYSQL_USER}
mysql.password=${MYSQL_PASSWORD}
