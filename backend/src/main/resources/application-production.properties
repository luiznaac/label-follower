# Layered over application.properties when SPRING_PROFILES_ACTIVE=production (the Docker image).
# Only what differs from the default profile lives here — the spotify.* keys are inherited as-is:
# every gateway appends its own "v1/..." path to spotify.apiUri, so a second copy of it here once
# pointed the image at ".../v1//v1/..." and broke every Spotify call (SpotifyPropertiesTest).

# No defaults in production: the container must be given its database explicitly.
mysql.host=${MYSQL_HOST}
mysql.user=${MYSQL_USER}
mysql.password=${MYSQL_PASSWORD}
