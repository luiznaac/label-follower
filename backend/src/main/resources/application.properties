server.port=${KTOR_PORT:8120}

# Defaults match `docker compose -f backend/docker-compose.yml up -d mysql` (or
# the root compose file) run with no extra setup: MYSQL_ALLOW_EMPTY_PASSWORD=yes,
# root, and MySQL published on localhost:8122. In the container the port is the
# fixed internal 3306 (the -production profile defaults it, and the root compose
# file's app service pins MYSQL_PORT=3306 for the separate migration process).
mysql.host=${MYSQL_HOST:localhost}
mysql.port=${MYSQL_PORT:8122}
mysql.user=${MYSQL_USER:root}
mysql.password=${MYSQL_PASSWORD:}
